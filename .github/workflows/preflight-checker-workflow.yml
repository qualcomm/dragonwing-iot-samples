name: preflight-checkers
on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  checker:
    uses: qualcomm/qcom-reusable-workflows/.github/workflows/reusable-qcom-preflight-checks-orchestrator.yml@91b6aaf83b6da6ccf30c2ffb99677937f64630f2 # v2
    with:
        enable-repolinter-check: true # default: true
        enable-semgrep-scan: true # default: true
        enable-copyright-license-check: true # default: true
        enable-commit-email-check: true # default: true

    secrets:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
